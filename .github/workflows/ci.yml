# Pattern-A Java CI for jakartaee-minimal-jpa-jaxrs.
# Builds with the Maven wrapper against the shared .github/ci-settings.xml,
# then runs a SonarQube scan. Credentials are injected from GitHub
# secrets/org variables into the settings file via env.
name: Java CI with Maven

# On every push to develop / feature branches and on PRs to develop.
on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches: [ "develop" ]

env:
  SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
  SONAR_URL: ${{vars.SONAR_HOST_URL}}

jobs:
  # Build, test, and package the project.
  maven-build:
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test with Maven
        run: ./mvnw clean verify -B -s .github/ci-settings.xml

  # Run a SonarQube analysis on the self-hosted runner.
  maven-sonar:
    runs-on: [self-hosted, Linux]
    needs: maven-build

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Disabling shallow clone improves the relevancy of Sonar reporting.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarQube Scan
        run: ./mvnw -B -Psonar -s .github/ci-settings.xml -Dsonar.branch.name=${GITHUB_REF#refs/heads/} compile sonar:sonar
